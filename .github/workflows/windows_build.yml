name: Build and test distributions

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Verify source is on main
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the selected commit to belong to main
        run: git merge-base --is-ancestor HEAD origin/main

  wheels:
    needs: source
    name: ${{ matrix.platform.name }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            architecture: x64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            architecture: arm64
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.architecture }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }}
          manylinux: ${{ runner.os == 'Linux' && '2014' || 'off' }}
          maturin-version: v1.16.0
          rust-toolchain: '1.92.0'
      - name: Install built wheel and tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -c 'import pathlib, subprocess, sys; wheel = next(pathlib.Path("dist").glob("*.whl")); subprocess.check_call([sys.executable, "-m", "pip", "install", str(wheel) + "[test]"])'
      - name: Test installed wheel outside source directory
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -c "$GITHUB_WORKSPACE/pyproject.toml"
      - name: Audit installed runtime and test environment
        shell: bash
        run: |
          python -m pip install --target "$RUNNER_TEMP/audit-tools" pip-audit
          python -m pip install --target "$RUNNER_TEMP/audit-env" "$(ls dist/*.whl)[test]"
          PYTHONPATH="$RUNNER_TEMP/audit-tools" python -m pip_audit --path "$RUNNER_TEMP/audit-env"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform.name }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build and validate source distribution
        run: |
          maturin sdist --out dist
          python -m twine check dist/*
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
          python -c 'import pathlib, subprocess, sys; wheel = next(pathlib.Path("rebuilt").glob("*.whl")); subprocess.check_call([sys.executable, "-m", "pip", "install", str(wheel) + "[test]"])'
      - name: Test wheel rebuilt from source distribution
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -c "$GITHUB_WORKSPACE/pyproject.toml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  audit:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Audit Python runtime, test, and notebook dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-audit.txt --require-hashes --disable-pip
          python docs/audit/scan_python_lock.py --output /tmp/python-all-platforms.json
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [wheels, sdist, audit]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require release tag to match package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert tomllib.loads(Path('Cargo.toml').read_text())['package']['version'] == version
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match package version'
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
