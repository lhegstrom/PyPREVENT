name: Build Wheels

on:
  push:
  pull_request:

jobs:
  build-windows-wheels:
    name: Build wheels on ${{ matrix.os }} for Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-2022
          - windows-2019
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create virtual environment
        shell: powershell
        run: |
          python -m venv venv

      - name: Install dependencies
        shell: powershell
        run: |
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install -r requirements.txt
          .\venv\Scripts\python.exe -m pip install maturin twine

      - name: Build Windows wheel
        shell: powershell
        run: |
          .\venv\Scripts\maturin.exe build `
            --release `
            --strip `
            --out dist

      - name: List built wheels
        shell: powershell
        run: |
          Get-ChildItem -Path dist

      - name: Publish Windows wheel to PyPI
        shell: powershell
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          .\venv\Scripts\twine.exe upload --skip-existing dist/*


  build-linux:
    name: Build Linux wheel for ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - cp39-cp39
          - cp310-cp310
          - cp311-cp311
          - cp312-cp312

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          pwd
          ls -la
          test -f Cargo.toml
          test -f pyproject.toml

      - name: Start manylinux container
        run: |
          docker run -d \
            --name manylinux \
            -v "${{ github.workspace }}:/PyPrevent" \
            quay.io/pypa/manylinux2014_x86_64 \
            tail -f /dev/null

      - name: Install Rust in container
        run: |
          docker exec manylinux bash -c \
            "curl --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rustup.rs \
            | sh -s -- -y"

      - name: Verify project and Python
        run: |
          docker exec manylinux bash -c "\
            echo 'Project directory:' && \
            ls -la /PyPrevent && \
            echo 'Cargo.toml:' && \
            ls -la /PyPrevent/Cargo.toml && \
            echo 'pyproject.toml:' && \
            ls -la /PyPrevent/pyproject.toml && \
            echo 'Python:' && \
            /opt/python/${{ matrix.python-version }}/bin/python --version"

      - name: Install maturin and build Linux wheel
        run: |
          docker exec manylinux bash -c "\
            source \$HOME/.cargo/env && \
            cd /PyPrevent && \
            /opt/python/${{ matrix.python-version }}/bin/python -m pip install --upgrade pip && \
            /opt/python/${{ matrix.python-version }}/bin/python -m pip install maturin && \
            /opt/python/${{ matrix.python-version }}/bin/python -m maturin build \
              --release \
              --manylinux 2014 \
              --interpreter /opt/python/${{ matrix.python-version }}/bin/python \
              --out /PyPrevent/dist"

      - name: List built wheels
        run: |
          ls -lah dist

      - name: Install Twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Publish Linux wheel to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --skip-existing dist/*

      - name: Stop manylinux container
        if: always()
        run: |
          docker rm -f manylinux || true
